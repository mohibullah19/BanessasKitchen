<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banessas Kitchen Event Sales Calculator</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width:1200px;
    margin:20px auto;
    padding:20px;
    background:#f5f5f5;
}

h1{
    text-align:center;
    color:#333;
}

.section{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.menu-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:8px;
}

.qty-controls{
    display:flex;
    align-items:center;
    gap:10px;
}

button{
    border:none;
    border-radius:6px;
    padding:8px 12px;
    cursor:pointer;
}

.plus{
    background:#28a745;
    color:white;
}

.minus{
    background:#dc3545;
    color:white;
}

.delete-btn{
    background:#dc3545;
    color:white;
}

.edit-btn{
    background:#ffc107;
}

.action-btn{
    background:#007bff;
    color:white;
    margin:5px;
}

.total{
    font-size:24px;
    font-weight:bold;
    text-align:center;
    margin:15px 0;
}

input{
    padding:8px;
    margin:5px;
}

.summary-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:10px;
}

.item-sales{
    padding:5px 0;
}
</style>
</head>
<body>

<h1>Banessas Kitchen Event Sales Calculator</h1>

<div class="section">

<h2>🔧 Manage Items</h2>

<input id="newItemName" placeholder="Item Name">
<input id="newItemPrice" type="number" step="0.01" placeholder="Price (£)">
<button class="action-btn" onclick="addItem()">Add Item</button>

</div>

<div class="section">

<h2>Menu</h2>

<div id="menuContainer"></div>

</div>

<div class="section">

<div class="total">
£ <span id="orderTotal">0.00</span>
</div>

<h3>Payment</h3>

<button class="action-btn" onclick="setPayment(5)">£5</button>
<button class="action-btn" onclick="setPayment(10)">£10</button>
<button class="action-btn" onclick="setPayment(20)">£20</button>
<button class="action-btn" onclick="setPayment(50)">£50</button>

<br><br>

<input
type="number"
id="paymentAmount"
step="0.01"
placeholder="Enter amount paid (£)"
oninput="calculateChange()"
>

<h3>
Change: £ <span id="change">0.00</span>
</h3>

<button class="action-btn" onclick="completeSale()">
Complete Sale
</button>

<button class="action-btn" onclick="clearCurrentOrder()">
Clear Current Order
</button>

</div>

<div class="section">

<h2>📊 Today's Event Summary</h2>

<div class="summary-grid">

<div>
<h3>Total Sales</h3>
<div id="salesCount">0</div>
</div>

<div>
<h3>Total Takings</h3>
<div>£ <span id="totalTakings">0.00</span></div>
</div>

</div>

<h3>Items Sold</h3>

<div id="salesBreakdown"></div>

<br>

<button class="action-btn" onclick="exportReport()">
📥 Export Sales Report
</button>

<button class="action-btn" onclick="resetDailyTotals()">
Reset Daily Totals
</button>

</div>

<script>

let menuItems =
JSON.parse(localStorage.getItem('menuItems')) || [
    {name:"Veg Samosa", price:1.00},
    {name:"Bitesize Chicken Tandoori Samosa", price:1.00},
    {name:"Meat Samosa", price:1.80},
    {name:"Samosa Chaat", price:5.00},
    {name:"Morcha Handesh", price:1.00},
    {name:"Cinnamon Handesh", price:1.00},
    {name:"Chocolate Fob", price:1.00}
];

let currentOrder = {};
let totalSales =
parseInt(localStorage.getItem('totalSales')) || 0;

let totalTakings =
parseFloat(localStorage.getItem('totalTakings')) || 0;

let itemsSold =
JSON.parse(localStorage.getItem('itemsSold')) || {};

function saveMenu(){
    localStorage.setItem(
        'menuItems',
        JSON.stringify(menuItems)
    );
}

function renderMenu(){

    const container =
    document.getElementById('menuContainer');

    container.innerHTML='';

    menuItems.forEach((item,index)=>{

        if(!currentOrder[item.name]){
            currentOrder[item.name]=0;
        }

        const row=document.createElement('div');
        row.className='menu-item';

        row.innerHTML=`
            <div>
                <strong>${item.name}</strong><br>
                £${item.price.toFixed(2)}
            </div>

            <div class="qty-controls">

                <button class="minus"
                    onclick="changeQty('${item.name}',-1)">
                    -
                </button>

                <span id="qty-${index}">
                    ${currentOrder[item.name]}
                </span>

                <button class="plus"
                    onclick="changeQty('${item.name}',1)">
                    +
                </button>

                <button class="edit-btn"
                    onclick="editItem(${index})">
                    Edit
                </button>

                <button class="delete-btn"
                    onclick="deleteItem(${index})">
                    Delete
                </button>

            </div>
        `;

        container.appendChild(row);

    });

    updateBreakdown();
    updateTotal();
}

function addItem(){

    const name =
    document.getElementById('newItemName').value.trim();

    const price =
    parseFloat(
    document.getElementById('newItemPrice').value);

    if(!name || isNaN(price)){
        alert("Enter item name and price");
        return;
    }

    menuItems.push({
        name,
        price
    });

    saveMenu();

    document.getElementById('newItemName').value='';
    document.getElementById('newItemPrice').value='';

    renderMenu();
}

function deleteItem(index){

    if(!confirm('Delete this item?')) return;

    delete currentOrder[menuItems[index].name];

    menuItems.splice(index,1);

    saveMenu();

    renderMenu();
}

function editItem(index){

    const newPrice =
    prompt(
      "New price (£)",
      menuItems[index].price
    );

    if(newPrice===null) return;

    menuItems[index].price =
    parseFloat(newPrice);

    saveMenu();

    renderMenu();
}

function changeQty(itemName, amount){

    currentOrder[itemName] =
    Math.max(0,
    (currentOrder[itemName] || 0)
    + amount);

    renderMenu();
}

function updateTotal(){

    let total=0;

    menuItems.forEach(item=>{

        total +=
        item.price *
        (currentOrder[item.name] || 0);

    });

    document.getElementById('orderTotal')
    .textContent=
    total.toFixed(2);

    calculateChange();
}

function setPayment(amount){

    document.getElementById(
        'paymentAmount'
    ).value=amount;

    calculateChange();
}

function calculateChange(){

    const total =
    parseFloat(
        document.getElementById(
            'orderTotal'
        ).textContent
    );

    const paid =
    parseFloat(
        document.getElementById(
            'paymentAmount'
        ).value
    ) || 0;

    document.getElementById('change')
    .textContent=
    Math.max(0,paid-total)
    .toFixed(2);
}

function clearCurrentOrder(){

    currentOrder={};

    renderMenu();

    document.getElementById(
        'paymentAmount'
    ).value='';

    document.getElementById(
        'change'
    ).textContent='0.00';
}

function completeSale(){

    let orderTotal=
    parseFloat(
    document.getElementById(
        'orderTotal'
    ).textContent);

    if(orderTotal<=0){
        alert('No items selected');
        return;
    }

    totalSales++;
    totalTakings += orderTotal;

    for(const item in currentOrder){

        itemsSold[item] =
        (itemsSold[item] || 0)
        + currentOrder[item];

    }

    saveSales();

    updateBreakdown();

    clearCurrentOrder();
}

function saveSales(){

    localStorage.setItem(
        'totalSales',
        totalSales
    );

    localStorage.setItem(
        'totalTakings',
        totalTakings
    );

    localStorage.setItem(
        'itemsSold',
        JSON.stringify(itemsSold)
    );
}

function updateBreakdown(){

    document.getElementById('salesCount')
    .textContent=totalSales;

    document.getElementById('totalTakings')
    .textContent=
    totalTakings.toFixed(2);

    const breakdown=
    document.getElementById(
        'salesBreakdown'
    );

    breakdown.innerHTML='';

    menuItems.forEach(item=>{

        const sold=
        itemsSold[item.name] || 0;

        breakdown.innerHTML += `
            <div class="item-sales">
                ${item.name}: ${sold}
            </div>
        `;
    });
}

function exportReport(){

    let report =
`Banessas Kitchen Event Sales Report

Total Sales: ${totalSales}
Total Takings: £${totalTakings.toFixed(2)}

Items Sold

`;

    for(const item in itemsSold){

        report +=
`${item}: ${itemsSold[item]}
`;

    }

    const blob =
    new Blob([report],
    {type:'text/plain'});

    const a=
    document.createElement('a');

    a.href=
    URL.createObjectURL(blob);

    a.download=
    'sales-report.txt';

    a.click();
}

function resetDailyTotals(){

    if(!confirm(
      'Reset all daily totals?'
    )) return;

    totalSales=0;
    totalTakings=0;
    itemsSold={};

    saveSales();

    updateBreakdown();
}

renderMenu();

</script>

</body>
</html>
